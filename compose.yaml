x-app-environment: &app-environment
  POSTGRES_DB: ${POSTGRES_DB:-aereo}
  POSTGRES_USER: ${POSTGRES_USER:-aereo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aereo}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET_NAME: ${MINIO_BUCKET:-geospatial-files}
  S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
  MAX_ARCHIVE_UNCOMPRESSED_SIZE: ${MAX_ARCHIVE_UNCOMPRESSED_SIZE:-209715200}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aereo}
      POSTGRES_USER: ${POSTGRES_USER:-aereo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aereo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: aereo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: aereo-app
    depends_on:
      minio:
        condition: service_started
    environment: *app-environment
    command: python manage.py ensure_storage_bucket
    restart: "no"

  migrate:
    build: .
    image: aereo-app
    command: python manage.py migrate --noinput
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: aereo-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    image: aereo-app
    command: python manage.py process_jobs
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
