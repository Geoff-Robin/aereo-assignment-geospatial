x-app-environment: &app-environment
  POSTGRES_DB: ${POSTGRES_DB:-aereo}
  POSTGRES_USER: ${POSTGRES_USER:-aereo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aereo}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  MEDIA_ROOT: /data/media
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
  MAX_ARCHIVE_UNCOMPRESSED_SIZE: ${MAX_ARCHIVE_UNCOMPRESSED_SIZE:-209715200}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aereo}
      POSTGRES_USER: ${POSTGRES_USER:-aereo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aereo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    image: aereo-app
    command: python manage.py migrate --noinput
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploaded-files:/data/media
    restart: "no"

  api:
    image: aereo-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - uploaded-files:/data/media
    restart: unless-stopped

  worker:
    image: aereo-app
    command: python manage.py process_jobs
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploaded-files:/data/media
    restart: unless-stopped

volumes:
  postgres-data:
  uploaded-files:
