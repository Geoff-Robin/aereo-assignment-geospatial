[project]
name = "aereo"
version = "0.1.0"
description = "Asynchronous geospatial file measurement API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.1",
    "geopandas>=1.0",
    "gunicorn>=23.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "shapely>=2.0",
]
